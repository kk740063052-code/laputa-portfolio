<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Design Portfolio</title>
    <style>
        /* ==========================================================================
           隐藏浏览器原生滚动条 (保留滚动功能，实现极致沉浸感)
           ========================================================================== */
        html, body {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE 10+ / 老版 Edge */
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none; /* Chrome / Safari / 新版 Edge */
        }
       * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            cursor: none; /* 隐藏默认光标 */
        }

        /* 去除所有超链接默认的蓝色和下划线 */
        a {
            color: inherit;
            text-decoration: none;
            cursor: none;
        }

        /* 自定义光标 */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease, background-color 0.2s ease;
            mix-blend-mode: difference;
        }

        /* 悬停时的光标状态 */
        .custom-cursor.hover {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
        }

        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .bg-image.active {
            opacity: 0.4;
        }

        .content-overlay {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            pointer-events: none;
        }

        /* 统一控制中间菜单块和分割线的宽度，使其居中且内部左对齐 */
        .menu-item {
            display: block; /* 让 a 标签表现为块级元素 */
            pointer-events: auto;
            text-align: left; /* 维持内部文字左对齐 */
            width: 45%;       /* 缩窄宽度（原来是60%），让整体向屏幕中央聚拢 */
            max-width: 720px; /* 限制最大宽度，防止在大屏幕上太散 */
            min-width: 480px;
            margin: 25px 0;
            cursor: none;
            position: relative;
        }

        .divider {
            width: 45%;
            max-width: 720px;
            min-width: 480px;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.12);
            margin: 20px 0;
        }

        .menu-title {
            font-size: 6.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            line-height: 1.05;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s ease;
            text-transform: uppercase;
        }

        .menu-item:hover .menu-title {
            color: rgba(255, 255, 255, 1);
        }

        .menu-subtitle {
            font-size: 0.95rem;
            color: #888;
            margin-top: 15px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0;
            box-sizing: border-box;
        }

        /* “查看” 文本的样式 */
        .view-text {
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateX(-10px);
            color: #ccc;
        }

        /* 悬停时显示“查看” */
        .menu-item:hover .view-text {
            opacity: 1;
            transform: translateX(0);
        }

       /* 顶部导航栏（与 about.html / laputa.html 100% 像素级对齐） */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }
        
        /* 左上角可点击 Logo */
        .logo {
            font-size: 1.15rem;
            letter-spacing: 2px;
            transition: opacity 0.3s ease;
        }

        .logo strong {
            font-weight: 800;
            color: #fff;
        }

        .logo span {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.55);
            margin-left: 4px;
        }

        .logo:hover {
            opacity: 0.8;
        }
        
        .nav-links {
            font-size: 1rem;
            color: #888;
            transition: color 0.3s ease;
        }

        .nav-links:hover {
            color: #fff;
        }

       /* ==========================================================================
           全屏加载页 (Loader Overlay)
           ========================================================================== */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #080808; 
            z-index: 999999; 
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: wait;
            gap: 20px; /* Logo与百分比的上下间距 */
        }

        /* 主体放大：Logo 样式 */
        .loader-logo {
            font-size: clamp(2.5rem, 6vw, 4.5rem); /* 大幅放大 Logo 字体 */
            letter-spacing: 6px;
            font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            text-align: center;
        }
        .loader-logo strong {
            font-weight: 800;
            color: #fff;
        }
        .loader-logo span {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.55);
            margin-left: 12px;
        }

        /* 放大百分比：对齐你指定的红色外框大小 */
        #loader-percentage {
            font-size: clamp(3.5rem, 7vw, 6rem); /* 将字号调整至外框对应的比例 */
            font-weight: 800;
            color: rgba(255, 255, 255, 0.9); /* 恢复一点亮度，保持主次分明 */
            font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; 
            letter-spacing: 6px; /* 增加一点字间距，视觉上拉宽填满红框 */
            line-height: 1;
            margin-top: 10px; /* 微调与上方标题的间距，贴合红框位置 */
        }
    </style>
</head>
<body>

    <!-- 全屏加载遮罩层 -->
    <!-- 全屏加载遮罩层 -->
    <div id="loader-overlay">
        <!-- 引入与导航栏一致的 Logo -->
        <div class="loader-logo"><strong>LEVEL</strong><span>DESIGN PORTFOLIO</span></div>
        <div id="loader-percentage">0%</div>
    </div>

    <!-- 自定义光标 -->
    <div class="custom-cursor" id="custom-cursor"></div>

    <div class="background-container">
        <!-- 替换为你自己的图片 -->
        <div class="bg-image" id="bg-project1" style="background-image: url('Cover.jpg');"></div>
        <div class="bg-image" id="bg-aboutme" style="background-image: url('角度C.jpg');"></div>
    </div>

    <!-- 顶部导航栏：左上角加上了 href="index.html"，点击即可回到此初始主页 -->
    <div class="top-nav">
        <a href="index.html" class="logo hover-target">
            <strong>LEVEL</strong><span>DESIGN PORTFOLIO</span>
        </a>
        <a href="index.html" class="nav-links hover-target">精选作品</a>
    </div>

    <!-- 居中菜单内容：每个选项都变成了可点击跳转的 a 标签 -->
    <div class="content-overlay">
        
        <!-- 点击跳转到 laputa.html（01 作品详情页） -->
        <a href="laputa.html" class="menu-item hover-target" data-target="bg-project1">
            <h1 class="menu-title">LAPUTA:<br>SHATTERED</h1>
            <div class="menu-subtitle">
                <span>01 崩毁的拉普达</span>
                <span class="view-text">查看 →</span>
            </div>
        </a>

        <div class="divider"></div>

        <!-- 点击跳转到 about.html（02 个人简介页） -->
        <a href="about.html" class="menu-item hover-target" data-target="bg-aboutme">
            <h1 class="menu-title">ABOUT ME</h1>
            <div class="menu-subtitle">
                <span>02 个人简介</span>
                <span class="view-text">查看 →</span>
            </div>
        </a>

    </div>

    <script>
        // --- 自定义光标逻辑 ---
        const cursor = document.getElementById('custom-cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const hoverTargets = document.querySelectorAll('.hover-target');
        hoverTargets.forEach(target => {
            target.addEventListener('mouseenter', () => {
                cursor.classList.add('hover');
            });
            target.addEventListener('mouseleave', () => {
                cursor.classList.remove('hover');
            });
        });

        // --- 背景切换与显示逻辑 ---
        const menuItems = document.querySelectorAll('.menu-item');
        const bgImages = document.querySelectorAll('.bg-image');

        menuItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                bgImages.forEach(bg => bg.classList.remove('active'));
                const targetId = item.getAttribute('data-target');
                const targetBg = document.getElementById(targetId);
                if (targetBg) {
                    targetBg.classList.add('active');
                }
            });

            item.addEventListener('mouseleave', () => {
                const targetId = item.getAttribute('data-target');
                const targetBg = document.getElementById(targetId);
                if (targetBg) {
                    targetBg.classList.remove('active');
                }
            });
        });
    </script>

    <!-- 预加载动画与资源加载脚本 (升级版：支持视频与图片双重缓存) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const percentageEl = document.getElementById('loader-percentage');
            const loaderOverlay = document.getElementById('loader-overlay');
            
            // 【重要】把你三个页面中所有不想白屏等待的 图片 和 视频 路径都写在这里
            const assetsToPreload = [
                // === 图片类 ===
                'Cover.jpg',
                '角度C.jpg',
                '白石龙.jpg',
                '13.jpg',
                '初始之地.jpg',
                'L1封面.jpg',
                'L2封面.jpg',
                'L3封面.jpg',
                'Hypercube.jpg',
                '风息碎片.jpg',
                '风息结晶.jpg',
                
                // === 视频类 (补上你需要预加载的视频路径) ===
                '机制演示视频/双倍升天术.mp4',
                '机制演示视频/双倍平台术.mp4',
                '机制演示视频/初始之地.mp4',
                '机制演示视频/升天术教学.mp4',
                '机制演示视频/跳跃感知.mp4',
                'Level1视频/水.mp4',
                'Level1视频/火引入.mp4',
                'Level1视频/风息结晶引入.mp4',
                'Level1视频/连续升天.mp4'
                // 如果还有别的短视频，继续往这里添加即可，注意用逗号隔开
            ];

            let loadedCount = 0;
            let currentDisplayPercent = 0;
            let targetPercent = 0;

            const checkProgress = () => {
                targetPercent = Math.floor((loadedCount / assetsToPreload.length) * 100);
            };

            const updatePercentage = () => {
                if (currentDisplayPercent < targetPercent) {
                    currentDisplayPercent += Math.ceil((targetPercent - currentDisplayPercent) * 0.15);
                    if (currentDisplayPercent > 100) currentDisplayPercent = 100;
                    percentageEl.textContent = currentDisplayPercent + '%';
                }
                
                if (currentDisplayPercent >= 100) {
                    percentageEl.textContent = '100%';
                    setTimeout(() => {
                        loaderOverlay.style.opacity = '0';
                        setTimeout(() => {
                            loaderOverlay.style.display = 'none';
                        }, 800); 
                    }, 400); 
                } else {
                    requestAnimationFrame(updatePercentage);
                }
            };
            requestAnimationFrame(updatePercentage);

            if (assetsToPreload.length === 0) {
                targetPercent = 100;
            } else {
                assetsToPreload.forEach(src => {
                    // 判断是否为视频文件
                    if (src.toLowerCase().endsWith('.mp4') || src.toLowerCase().endsWith('.webm')) {
                        // 使用 fetch 将视频预先拉取到浏览器内存中
                        fetch(src)
                            .then(response => response.blob())
                            .then(() => {
                                loadedCount++;
                                checkProgress();
                            })
                            .catch(() => {
                                // 即使加载失败也算作处理完毕，防止卡死
                                loadedCount++;
                                checkProgress();
                            });
                    } else {
                        // 常规图片预加载
                        const img = new Image();
                        img.src = src;
                        img.onload = img.onerror = () => {
                            loadedCount++;
                            checkProgress();
                        };
                    }
                });
            }
            
            // 【兜底安全锁】强制最大等待时间 (目前设为 12 秒)
            // 如果你的视频非常大，12秒内没加载完，也会强制让玩家进主页，体验更好
            setTimeout(() => {
                targetPercent = 100;
            }, 12000);
        });
    </script>
</body>
</html>
